name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node }}, ShareDB ${{ matrix.sharedb }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        sharedb: [7]
        include:
          - { node: 24, sharedb: 4 }
          - { node: 24, sharedb: 5 }
          - { node: 24, sharedb: 6 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # The peer dependency is installed last, to test against each supported major version
      - run: npm install --no-save sharedb@${{ matrix.sharedb }}
      - run: npm run test-cover
